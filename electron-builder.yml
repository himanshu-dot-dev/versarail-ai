appId: com.versarail.ai.harness
productName: VersaRail AI
copyright: Copyright © 2026 VersaRail AI

directories:
  output: dist
  buildResources: resources

files:
  - out/**/*
  - package.json

asar: true
asarUnpack: []

afterPack: scripts/after-pack.js

win:
  target:
    - target: nsis
      arch:
        - x64
    - target: portable
      arch:
        - x64

nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  deleteAppDataOnUninstall: false
  runAfterFinish: false

mac:
  target:
    - target: dmg
      arch:
        - x64
        - arm64
    - target: zip
      arch:
        - x64
        - arm64
  category: public.app-category.developer-tools
  hardenedRuntime: true
  gatekeeperAssess: false
  entitlements: resources/entitlements.mac.plist
  entitlementsInherit: resources/entitlements.mac.inherit.plist

linux:
  target:
    - target: AppImage
      arch:
        - x64
    - target: deb
      arch:
        - x64
  category: Development
  synopsis: Secure Multi-Provider AI Agent Harness for Desktop
  description: Local-first, developer-centric desktop workstation with BYOK provider orchestration and hardened sandboxing.

publish:
  provider: github
  owner: himanshu-dot-dev
  repo: versarail-ai
